name: CI
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest

    # TEMPORARY: hardcoded env values for a quick run
    env:
      E2E_BASE_URL: https://www.saucedemo.com/
      E2E_USERNAME: standard_user
      E2E_PASSWORD: secret_sauce

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install pytest pytest-playwright python-dotenv
          python -m playwright install --with-deps

      # TEMPORARY: create a .env so load_dotenv() also picks it up
      - name: Create .env (temporary)
        run: |
          cat > .env <<EOF
          E2E_BASE_URL=${E2E_BASE_URL}
          E2E_USERNAME=${E2E_USERNAME}
          E2E_PASSWORD=${E2E_PASSWORD}
          EOF

      - name: Sanity check env presence (masked)
        run: |
          for v in E2E_BASE_URL E2E_USERNAME E2E_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error title=Missing env::Environment variable $v is not set"
              exit 1
            else
              echo "$v is set (length: ${#v})"
            fi
          done

      - name: Run tests
        run: pytest --screenshot=only-on-failure --video=retain-on-failure --tracing=on
