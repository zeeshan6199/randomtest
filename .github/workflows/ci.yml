name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pytest pytest-playwright python-dotenv; fi
          python -m playwright install --with-deps

      # Build a .env file from repo Variable (URL) + Secrets (creds)
      - name: Create .env from Vars/Secrets
        run: |
          cat > .env <<EOF
          E2E_BASE_URL=${{vars.E_BASE_URL }}
          E2E_USERNAME=${{secrets.E_USERNAME }}
          E2E_PASSWORD=${{secrets.E_PASSWORD }}
          EOF

      - name: Sanity check env presence (masked)
        run: |
          for v in E2E_BASE_URL E2E_USERNAME E2E_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error title=Missing env::Environment variable $v is not set"
              exit 1
            else
              echo "$v is set (length: ${#v})"
            fi
          done

      - name: Run tests
        run: |
          pytest --screenshot=only-on-failure --video=retain-on-failure --tracing=on

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            artifacts/**
            **/*.png
            **/*.html
            **/trace.zip
            **/video*.webm
          if-no-files-found: ignore
